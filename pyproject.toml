[project]
name = "togetherness-speech-pipeline"
version = "0.1.0"
description = "Local-first Hinglish speech transcription, refinement, and synthesis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.2.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
]

[project.scripts]
togetherness-transcribe = "speech_pipeline.transcribe:main"
togetherness-audit = "speech_pipeline.audit:main"
togetherness-refine = "speech_pipeline.refine:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech_pipeline"]
